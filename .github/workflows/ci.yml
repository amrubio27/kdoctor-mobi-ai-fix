# kdoctor CI fast gate (Round-3 #9 + #9.1 polish)
#
# Complements the existing `.github/workflows/mobiai-install-test.yml`
# (slow MobiAI integration test). This file is the *fast* gate that
# runs on every push and PR — catches formatting drift, vet violations,
# race conditions, build breakage, and dependency drift in seconds.
#
# Triggers: push to main, PR targeting main (paths-ignore excludes pure
# doc-only changes — see Round-3 #9.1 polish).
# Runtime: ~2-3 minutes on ubuntu-latest cold cache; <60s with cache.

name: CI Fast Gate

# Round-3 #9.1 polish: paths-ignore filter prevents the gate from running
# on pure-docs pushes (HANDOVER.md, dashboard docs/*, etc.) saving ~2-3min
# CI minutes per push. CI still runs on any .go / .mod / .sum / .yml change
# (paths-ignore = match-all minus excluded patterns).

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "CHANGELOG.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "CHANGELOG.md"

# Cancel any in-progress run for the same branch if a new commit lands.
concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read  # read-only; no GitHub API write needed

jobs:
  ci-fast-gate:
    name: gofmt + vet + race-tests + build + tidy-drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go (with module cache)
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            **/go.mod

      # The integration tests run a real scan, and detekt needs a JVM it can
      # load. Pinning one here is what lets those tests be a hard failure
      # rather than something that quietly skips: the runner default has
      # changed before, and detekt 1.23 cannot load a feature release newer
      # than 21.
      - name: Set up Java for detekt
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The integration tests run a real scan now, and kdoctor fetches detekt
      # (~50 MB) plus the Compose rules plugin on first use. Cache them so only
      # the first run on a new pinned version pays for it.
      - name: Cache kdoctor tool downloads
        uses: actions/cache@v4
        with:
          path: ~/.kdoctor/tools
          key: kdoctor-tools-${{ runner.os }}-${{ hashFiles('internal/core/detektrunner/provision.go') }}
          restore-keys: |
            kdoctor-tools-${{ runner.os }}-

      # Round-3 #9 part A: detect formatting drift.
      # `gofmt -l` lists files that DO NOT match canonical gofmt format.
      # Empty output = clean. Non-empty = fail.

      - name: gofmt drift check
        run: |
          drift=$(gofmt -l .)
          if [ -n "$drift" ]; then
            echo "::error::gofmt drift detected in:"
            echo "$drift"
            echo "::group::Run 'gofmt -w .' locally to fix."
            exit 1
          fi

      # Standard static analysis. `go vet` exits non-zero on violations.
      - name: go vet ./...
        run: go vet ./...

      # Race detector across the whole test suite. Catches data races
      # in pathutil Os.Stat loops, claude.go atomic cache write,
      # diff.go subprocess management.

      - name: go test (with -race)
        # 120s was enough while the integration tests skipped themselves.
        # They run for real now (kdoctor provisions detekt on first use),
        # so a scan of the fixtures has to fit in the budget.
        env:
          # Turns "detekt could not run" from a skip into a failure. CI has a
          # JVM and a network, so a degraded scan here is a real regression;
          # a developer without a JDK gets an explained skip instead.
          KDOCTOR_REQUIRE_DETEKT: '1'
        run: go test -race -count=1 -timeout=600s ./...

      # Build smoke test across every package, not just cmd/kdoctor:
      # cmd/kdoctor-mcp was outside the gate and could break unnoticed.
      - name: go build ./...
        run: go build ./...

      # Dependency drift gate. Pinned versions produce zero diff.
      # If `go mod tidy` wants to add/remove requires, fail the gate so
      # the author commits the tidy change explicitly.

      - name: go mod tidy drift check
        run: |
          cp go.mod /tmp/go.mod.before
          cp go.sum /tmp/go.sum.before
          # `go mod tidy` is allowed to fail (e.g. network down) but in
          # that case we cannot make a drift determination; exit-early.
          go mod tidy || { echo "::warning::go mod tidy failed (likely network); skipping drift check"; exit 0; }
          if ! diff -q /tmp/go.mod.before go.mod >/dev/null; then
            echo "::error::go.mod drift detected. Run 'go mod tidy' locally and commit."
            diff /tmp/go.mod.before go.mod | head -40 || true
            exit 1
          fi
          if ! diff -q /tmp/go.sum.before go.sum >/dev/null; then
            echo "::error::go.sum drift detected. Run 'go mod tidy' locally and commit."
            diff /tmp/go.sum.before go.sum | head -40 || true
            exit 1
          fi
