name: MobiAI Integration Test

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "CHANGELOG.md"
      - "examples/**"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "CHANGELOG.md"
      - "examples/**"




jobs:
  mobiai-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Build kdoctor
        run: go build -o kdoctor cmd/kdoctor/main.go
        
      # Install mobiai mock/cli for testing.
      # Round-3 #9.1 polish: pinned to mobiai@^1.0.0 (semver range) instead of
      # @latest. Avoids supply-chain risk where a compromised mobiai release
      # auto-installs into CI. If a newer minor is needed, bump the version
      # below explicitly and audit the change.
      - name: Install MobiAI
        continue-on-error: true
        run: |
          set -euo pipefail
          npm install -g 'mobiai@^1.0.0' || true

      - name: Install Detekt CLI
        run: |
          mkdir -p /tmp/detekt
          curl -fsSL -L -o /tmp/detekt/detekt-cli.zip https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8.zip
          unzip -q /tmp/detekt/detekt-cli.zip -d /tmp/detekt
          DETEKT_BIN=$(find /tmp/detekt -name "detekt-cli" -type f | head -n 1)
          chmod +x "$DETEKT_BIN"
          echo "DETEKT_BIN=$DETEKT_BIN" >> $GITHUB_ENV

      - name: Run kdoctor scan --mobiai on bad-project
        run: |
          set -euo pipefail
          ./kdoctor scan --mobiai --prefer-standalone --detekt-bin "$DETEKT_BIN" --project-dir examples/bad-project
          
      - name: Verify findings.jsonl is created
        run: |
          set -euo pipefail
          if [ ! -f "examples/bad-project/.mobiai/graph/findings.jsonl" ]; then
            echo "::error::findings.jsonl was not generated."
            exit 1
          fi
          
          # Basic validation of the JSONL structure
          count=$(wc -l < examples/bad-project/.mobiai/graph/findings.jsonl)
          echo "Generated $count findings for MobiAI Graph."
          if [ "$count" -lt "1" ]; then
            echo "::error::expected at least 1 finding in JSONL, got $count."
            exit 1
          fi
