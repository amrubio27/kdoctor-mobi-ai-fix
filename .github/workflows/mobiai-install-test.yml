name: MobiAI Integration Test

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "CHANGELOG.md"
      - "examples/**"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "CHANGELOG.md"
      - "examples/**"




jobs:
  mobiai-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Build kdoctor
        run: go build -o kdoctor cmd/kdoctor/main.go
        
      # Install mobiai mock/cli for testing.
      # Round-3 #9.1 polish: pinned to mobiai@^1.0.0 (semver range) instead of
      # @latest. Avoids supply-chain risk where a compromised mobiai release
      # auto-installs into CI. If a newer minor is needed, bump the version
      # below explicitly and audit the change.
      - name: Install MobiAI
        run: |
          set -euo pipefail
          npm install -g 'mobiai@^1.0.0'

      - name: Run kdoctor scan --mobiai on bad-project
        run: |
          set -euo pipefail
          ./kdoctor scan --mobiai --project-dir examples/bad-project
          
      - name: Verify findings.jsonl is created
        run: |
          set -euo pipefail
          if [ ! -f "examples/bad-project/.mobiai/graph/findings.jsonl" ]; then
            echo "::error::findings.jsonl was not generated."
            exit 1
          fi
          
          # Basic validation of the JSONL structure
          count=$(wc -l < examples/bad-project/.mobiai/graph/findings.jsonl)
          echo "Generated $count findings for MobiAI Graph."
          if [ "$count" -lt "1" ]; then
            echo "::error::expected at least 1 finding in JSONL, got $count."
            exit 1
          fi
